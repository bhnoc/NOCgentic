worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Docker's embedded DNS. Required for dynamic upstream re-resolution so
    # that recreating a container (new IP on the Docker bridge) doesn't leave
    # nginx holding the old address forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # NOTE: We intentionally do NOT use `upstream { server X; }` blocks.
    # Nginx resolves those once at startup and caches the IP forever.
    # Instead, each `location` sets a variable and uses it in proxy_pass,
    # which forces re-resolution via the docker DNS on every request
    # (cached for `valid=10s`).

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        server_name aing.bhnoc.com;

        # Allow ACME challenge for cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name aing.bhnoc.com;

        ssl_certificate     /etc/letsencrypt/live/aing.bhnoc.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aing.bhnoc.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Chat API
        location /api/v1/chat {
            set $web_upstream "web-server";
            proxy_pass http://$web_upstream:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Alerts API
        location /api/v1/alerts {
            set $web_upstream "web-server";
            proxy_pass http://$web_upstream:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket
        location /ws {
            set $web_upstream "web-server";
            proxy_pass http://$web_upstream:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # Health
        location /health {
            set $web_upstream "web-server";
            proxy_pass http://$web_upstream:3000;
        }

        # Audit monitor — token-gated, SSE-heavy, proxy without buffering.
        # The rewrite strips the /bh/1337/thetraces/ prefix so the FastAPI
        # app (which also sets root_path for URL generation) sees clean paths.
        location /bh/1337/thetraces/ {
            set $audit_upstream "audit-monitor";
            rewrite ^/bh/1337/thetraces/(.*)$ /$1 break;
            proxy_pass http://$audit_upstream:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /bh/1337/thetraces;

            # SSE / long-lived streams
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Pass through WebSocket headers (harmless for plain HTTP)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Default: serve web UI
        location / {
            set $web_upstream "web-server";
            proxy_pass http://$web_upstream:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
