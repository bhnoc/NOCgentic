      - LANE_RACE=${LANE_RACE:-auto}
      - LANE_MODE=${LANE_MODE:-}
      - LANE_SIDE_BY_SIDE=${LANE_SIDE_BY_SIDE:-true}
      - LOCAL_SQL_BASE_URL=${LOCAL_SQL_BASE_URL:-}
      - LOCAL_SQL_MODEL=${LOCAL_SQL_MODEL:-}
      - LOCAL_PROSE_BASE_URL=${LOCAL_PROSE_BASE_URL:-}
      - LOCAL_PROSE_MODEL=${LOCAL_PROSE_MODEL:-}
      # HYBRID: set SQLGEN_PROVIDER=local to route ONLY NL->SQL gen to AQLight while
      # synthesis stays on LLM_PROVIDER (Gemini). Unset -> SQL gen uses LLM_PROVIDER too.
      - SQLGEN_PROVIDER=${SQLGEN_PROVIDER:-}
      - SQLGEN_MODEL=${SQLGEN_MODEL:-}
      - ATHENA_DATABASE=${ATHENA_DATABASE:-blackhatnoc_glue}
      - ATHENA_WORKGROUP=${ATHENA_WORKGROUP:-blackhatnoc-usa2026}
      - ATHENA_REGION=${ATHENA_REGION:-us-east-2}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_API_KEY=${OTEL_EXPORTER_OTLP_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
