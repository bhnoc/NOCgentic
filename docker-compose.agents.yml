services:
  orchestrator:
    build:
      context: .
      dockerfile: agents/orchestrator/Dockerfile
    # Internal only. The orchestrator is reached by web-server over the docker
    # network (http://orchestrator:8001); it must NOT be published to the host —
    # publishing put /admin/killswitch on the public interface (SG-gated only).
    expose:
      - "8001"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Local model (AQLight = fine-tuned Qwen2.5-Coder-7B NL->SQL, served on the box
      # via llama.cpp). Active only when LLM_PROVIDER=local. Default base URL points at
      # the host's llama-server via the docker bridge gateway (host.docker.internal on
      # Docker Desktop; on Linux add an extra_hosts mapping or set LOCAL_LLM_BASE_URL to
      # the host IP). See docs/llm/AQLight-integration.md.
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-AQLight}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-not-needed}
      # LANE RACE: cloud (Gemini) vs local run concurrently and the fastest is
      # shown, with a UI swap to the other. LANE_RACE=auto races only when a local
      # endpoint is configured, so this is inert on a CPU-only box.
      #
      # LOCAL_PROSE_* must default to EMPTY, not to a model name. Unset means the
      # prose role falls back to the SQL endpoint, i.e. AQLight does both jobs, which
      # is the default. Defaulting the model name alone would ask AQLight's
      # llama-server for a model it does not serve. See docs/llm/lane-race.md.
      #
      # LANE_MODE overrides LANE_RACE outright: hybrid | cloud | local. Leave it
      # unset and the mode is derived from LANE_RACE, which keeps every existing box
      # behaving as before. An operator can change it at runtime from the settings
      # gear in the audit monitor, which does NOT touch these values: the override is
      # process state and a restart comes back to whatever is set here.
      # LANE_SIDE_BY_SIDE=false keeps the race but shows one answer and no swap.
      - LANE_RACE=${LANE_RACE:-auto}
      - LANE_MODE=${LANE_MODE:-}
      - LANE_SIDE_BY_SIDE=${LANE_SIDE_BY_SIDE:-true}
      - LOCAL_SQL_BASE_URL=${LOCAL_SQL_BASE_URL:-}
      - LOCAL_SQL_MODEL=${LOCAL_SQL_MODEL:-}
      - LOCAL_PROSE_BASE_URL=${LOCAL_PROSE_BASE_URL:-}
      - LOCAL_PROSE_MODEL=${LOCAL_PROSE_MODEL:-}
      # RESPONSE CACHE: repeat questions come back from Redis instead of re-running
      # the agent. Only the orchestrator needs these; the cache sits after every
      # guardrail so a hit is never a cover response or a contained session's answer.
      # Hits are paced to 2-5s so a cached answer doesn't return suspiciously fast,
      # which would make response time a side channel. See docs/cache/response-cache.md.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RESPONSE_CACHE_ENABLED=${RESPONSE_CACHE_ENABLED:-true}
      - RESPONSE_CACHE_TTL_SECONDS=${RESPONSE_CACHE_TTL_SECONDS:-900}
      - RESPONSE_CACHE_HIT_DELAY_MIN=${RESPONSE_CACHE_HIT_DELAY_MIN:-2.0}
      - RESPONSE_CACHE_HIT_DELAY_MAX=${RESPONSE_CACHE_HIT_DELAY_MAX:-5.0}
      # MODEL SUPERVISOR: lets the settings gear start and stop llama-server on the
      # HOST. Unset on any box without a GPU, which makes the model controls read-only
      # (discovery still works) rather than broken. Deliberately not a container: see
      # ops/model-supervisor/README.md for why, and for the loopback/bridge binding.
      - MODEL_SUPERVISOR_URL=${MODEL_SUPERVISOR_URL:-}
      - MODEL_SUPERVISOR_TOKEN=${MODEL_SUPERVISOR_TOKEN:-}
      - ADMIN_BEARER_TOKEN=${ADMIN_BEARER_TOKEN}
      # How long a Manifold threat keeps a session quarantined, in seconds.
      - QUARANTINE_TTL_SECONDS=${QUARANTINE_TTL_SECONDS:-1800}
      - ALERT_TRIAGE_URL=http://alert-triage:8003
      - THOUSANDEYES_ANALYST_URL=http://thousandeyes-analyst:8004
      - ATHENA_HUNTER_URL=http://athena-hunter:8005
      # DETER: where a quarantined session's queries go instead of a canned cover.
      # DETER_ENABLED=false reverts that path to the cover text with no redeploy of
      # the agent itself. The timeout is deliberately far below the 180s the
      # specialist agents get — a contained caller waiting three minutes learns
      # more from the wait than from any answer. See docs/security/deter-agent.md.
      - DETER_URL=http://deter:8006
      - DETER_ENABLED=${DETER_ENABLED:-true}
      - DETER_TIMEOUT_SECONDS=${DETER_TIMEOUT_SECONDS:-25.0}
      # Wall-clock FLOOR for the deter path, including its cover fallback. A deter
      # answer is a cheap LLM call and a cover is no call at all, so either can land
      # far faster than the agent the response claims to come from. Response time is
      # a side channel that needs no interpretation.
      #
      # [2, 6] is a deliberate trade-off made WITH the measurement, not without it:
      # athena-hunter (which deter claims to be) runs p50 17.0s / p95 33.9s on this
      # box (n=99, 2026-08-04), so this is faster than the agent it impersonates.
      # It buys responsiveness for the false positives containment will produce,
      # and it still closes the millisecond gap that was the loud tell. The deter
      # agent's own p95 is ~1s, so the padding sets the response time outright.
      # See docs/security/deter-agent.md before widening or narrowing.
      - DETER_PACE_MIN_SECONDS=${DETER_PACE_MIN_SECONDS:-2.0}
      - DETER_PACE_MAX_SECONDS=${DETER_PACE_MAX_SECONDS:-6.0}
      # S3_REGION only. This is the documented fallback for TRACE_S3_REGION in
      # s3_span_exporter and for ISSUE_REPORT_S3_REGION in issue_report_uploader.
      #
      # S3_BUCKET and S3_PREFIX used to be here too and were read by nothing:
      # the span archive takes TRACE_S3_BUCKET/TRACE_S3_PREFIX. S3_PREFIX also
      # had no default, so an unset value made compose warn on every up. Do not
      # re-add them without a reader.
      - S3_REGION=${S3_REGION:-us-east-2}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_API_KEY=${OTEL_EXPORTER_OTLP_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - TRACE_S3_BUCKET=${TRACE_S3_BUCKET:-blackhatnoc}
      - TRACE_S3_PREFIX=${TRACE_S3_PREFIX:-nocgentic/traces}
      - TRACE_S3_REGION=${TRACE_S3_REGION:-us-east-2}
      # Report Issue widget (chat + threat hunt UI): screenshot + note uploads.
      # Same bucket as the trace archive, deliberately a different prefix so
      # audit-monitor (AUDIT_PREFIX=nocgentic/traces) never surfaces these.
      - ISSUE_REPORT_S3_BUCKET=${ISSUE_REPORT_S3_BUCKET:-blackhatnoc}
      - ISSUE_REPORT_S3_PREFIX=${ISSUE_REPORT_S3_PREFIX:-nocgentic/issue-reports}
      - ISSUE_REPORT_S3_REGION=${ISSUE_REPORT_S3_REGION:-us-east-2}
      - OTEL_SERVICE_NAME=bhnocgentic-orchestrator
      # Public event-edition label (display only). Nation + year, e.g. "USA 2027".
      - EVENT_EDITION=${EVENT_EDITION:-USA 2026}
      # The venue's wall clock. Unlike EVENT_EDITION this is NOT display branding:
      # the dt partition is a UTC calendar day, so "today" has to be resolved
      # against the analyst's local day or every same-day count truncates once the
      # UTC date rolls over (17:00 local in Las Vegas). Asia editions: Asia/Singapore.
      - EVENT_TZ=${EVENT_TZ:-America/Los_Angeles}
    # Resolve host.docker.internal to the host on Linux, so the default
    # LOCAL_LLM_BASE_URL can reach the host's llama-server (AQLight) when
    # LLM_PROVIDER=local. Harmless when the local provider is not used.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alert-triage
      - thousandeyes-analyst
      - athena-hunter
      - deter
      - redis
    restart: unless-stopped

  alert-triage:
    build:
      context: .
      dockerfile: agents/alert-triage/Dockerfile
    expose:
