  # Answers CONTAINED sessions (Manifold quarantine) from a vetted safe data pool
  # instead of a canned cover. Reachable ONLY from the orchestrator's quarantine
  # branch — no intent routes here, and like every agent it is expose-only, so
  # nothing outside the compose network can reach it directly.
  #
  # DETER_ATHENA_ENABLED defaults to FALSE: every facet then serves its static
  # roll-up, which is a complete answer on its own. Turn it on to make the pool
  # read live venue aggregates. Either way the caller's text never reaches SQL —
  # it selects which author-written facet is read and nothing else. See
  # agents/deter/safe_pool.py and docs/security/deter-agent.md.
  deter:
    build:
      context: .
      dockerfile: agents/deter/Dockerfile
    expose:
      - "8006"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-AQLight}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-not-needed}
      # No LANE_* here on purpose: the deter path serves a single answer and
      # reports a synthetic lane pair, so racing two models would double the LLM
      # spend on hostile traffic for a swap surface that is already synthetic.
      - LOCAL_PROSE_BASE_URL=${LOCAL_PROSE_BASE_URL:-}
      - LOCAL_PROSE_MODEL=${LOCAL_PROSE_MODEL:-}
      # Pinned SEPARATELY from the platform-wide GEMINI_MODEL: this agent writes
      # short prose over a small JSON context, which is not the hunt agents'
      # workload and should not inherit their model in either direction.
      # gemini-2.5-flash-lite measured best 2026-08-04 — p50 0.89s, p95 1.03s, the
      # only candidate at a 100% output-screen pass rate before the screen was
      # fixed, and still fastest after. Re-run scripts/bench_deter_models.py before
      # changing; screen pass rate matters more than latency, because a model that
      # trips the screen serves canned cover instead of a deterrent answer.
      - DETER_MODEL=${DETER_MODEL:-gemini-2.5-flash-lite}
      - DETER_ATHENA_ENABLED=${DETER_ATHENA_ENABLED:-false}
      - DETER_WINDOW_HOURS=${DETER_WINDOW_HOURS:-24}
      - DETER_ATHENA_TIMEOUT=${DETER_ATHENA_TIMEOUT:-12.0}
      - ATHENA_DATABASE=${ATHENA_DATABASE:-blackhatnoc_glue}
      - ATHENA_WORKGROUP=${ATHENA_WORKGROUP:-blackhatnoc-usa2026}
      - ATHENA_REGION=${ATHENA_REGION:-us-east-2}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_API_KEY=${OTEL_EXPORTER_OTLP_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - TRACE_S3_BUCKET=${TRACE_S3_BUCKET:-blackhatnoc}
      - TRACE_S3_PREFIX=${TRACE_S3_PREFIX:-nocgentic/traces}
      - TRACE_S3_REGION=${TRACE_S3_REGION:-us-east-2}
      - OTEL_SERVICE_NAME=bhnocgentic-deter
      - EVENT_EDITION=${EVENT_EDITION:-USA 2026}
      # The venue's wall clock. Unlike EVENT_EDITION this is NOT display branding:
      # the dt partition is a UTC calendar day, so "today" has to be resolved
      # against the analyst's local day or every same-day count truncates once the
      # UTC date rolls over (17:00 local in Las Vegas). Asia editions: Asia/Singapore.
      - EVENT_TZ=${EVENT_TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  thousandeyes-analyst:
    build:
      context: .
      dockerfile: agents/thousandeyes-analyst/Dockerfile
    expose:
      - "8004"
    environment:
      - THOUSANDEYES_BEARER_TOKEN=${THOUSANDEYES_BEARER_TOKEN}
      # Account group is partitioned by conference (BH ASIA 2094085, BH USA
      # 2094129, BH Europe 2094130). Update alongside EVENT_EDITION per show.
      - THOUSANDEYES_ACCOUNT_GROUP=${THOUSANDEYES_ACCOUNT_GROUP:-2094129}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-AQLight}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-not-needed}
      # LANE RACE: cloud (Gemini) vs local run concurrently and the fastest is
      # shown, with a UI swap to the other. LANE_RACE=auto races only when a local
      # endpoint is configured, so this is inert on a CPU-only box.
      #
      # LOCAL_PROSE_* must default to EMPTY, not to a model name. Unset means the
      # prose role falls back to the SQL endpoint, i.e. AQLight does both jobs, which
      # is the default. Defaulting the model name alone would ask AQLight's
      # llama-server for a model it does not serve. See docs/llm/lane-race.md.
      #
      # LANE_MODE overrides LANE_RACE outright: hybrid | cloud | local. Leave it
      # unset and the mode is derived from LANE_RACE, which keeps every existing box
      # behaving as before. An operator can change it at runtime from the settings
      # gear in the audit monitor, which does NOT touch these values: the override is
      # process state and a restart comes back to whatever is set here.
      # LANE_SIDE_BY_SIDE=false keeps the race but shows one answer and no swap.
      - LANE_RACE=${LANE_RACE:-auto}
      - LANE_MODE=${LANE_MODE:-}
      - LANE_SIDE_BY_SIDE=${LANE_SIDE_BY_SIDE:-true}
      - LOCAL_SQL_BASE_URL=${LOCAL_SQL_BASE_URL:-}
      - LOCAL_SQL_MODEL=${LOCAL_SQL_MODEL:-}
      - LOCAL_PROSE_BASE_URL=${LOCAL_PROSE_BASE_URL:-}
      - LOCAL_PROSE_MODEL=${LOCAL_PROSE_MODEL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_API_KEY=${OTEL_EXPORTER_OTLP_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - TRACE_S3_BUCKET=${TRACE_S3_BUCKET:-blackhatnoc}
      - TRACE_S3_PREFIX=${TRACE_S3_PREFIX:-nocgentic/traces}
      - TRACE_S3_REGION=${TRACE_S3_REGION:-us-east-2}
      - OTEL_SERVICE_NAME=bhnocgentic-thousandeyes-analyst
      - EVENT_EDITION=${EVENT_EDITION:-USA 2026}
      # The venue's wall clock. Unlike EVENT_EDITION this is NOT display branding:
      # the dt partition is a UTC calendar day, so "today" has to be resolved
      # against the analyst's local day or every same-day count truncates once the
      # UTC date rolls over (17:00 local in Las Vegas). Asia editions: Asia/Singapore.
      - EVENT_TZ=${EVENT_TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  audit-monitor:
    build:
      context: .
      dockerfile: tools/audit-monitor/Dockerfile
    expose:
      - "8787"
    environment:
      - AUDIT_BUCKET=${AUDIT_BUCKET:-blackhatnoc}
      - AUDIT_PREFIX=${AUDIT_PREFIX:-nocgentic/traces}
      - AUDIT_REGION=${AUDIT_REGION:-us-east-2}
      - AUDIT_ROOT_PATH=/bh/1337/thetraces
      - AUDIT_POLL_S=${AUDIT_POLL_S:-2}
      - AUDIT_LOOKBACK=${AUDIT_LOOKBACK:-300}
      - AUDIT_BEARER_TOKEN=${AUDIT_BEARER_TOKEN}
      - AUDIT_COOKIE_SECRET=${AUDIT_COOKIE_SECRET}
      - AUDIT_COOKIE_TTL=${AUDIT_COOKIE_TTL:-86400}
      # Forwarded to the orchestrator's now-authenticated /admin/* endpoints.
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - ADMIN_BEARER_TOKEN=${ADMIN_BEARER_TOKEN}
    restart: unless-stopped

  web-server:
    build:
      context: .
      dockerfile: packages/web-server/Dockerfile
    expose:
      - "3000"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - ATHENA_HUNTER_URL=http://athena-hunter:8005
      # Lets the alert feed read the orchestrator kill-switch so "kill athena"
      # also freezes the live feed, not just chat (QA sweep 4, cc-1).
      - ADMIN_BEARER_TOKEN=${ADMIN_BEARER_TOKEN}
      # Bearer token Manifold must present to POST /api/v1/manifold/webhook.
      # Unset -> the receiver fails closed and 401s everything.
      - MANIFOLD_WEBHOOK_TOKEN=${MANIFOLD_WEBHOOK_TOKEN}
      - ALERT_REFRESH_MS=${ALERT_REFRESH_MS:-1800000}
      - ALERT_LOOKBACK_HOURS=${ALERT_LOOKBACK_HOURS:-24}
      - ALERT_MAX_FETCH=${ALERT_MAX_FETCH:-200}
      - PORT=3000
      - NODE_ENV=production
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://ng.bhnoc.com,https://ngremote.bhnoc.com}
      # Public event-edition label shown in the UI (served via /api/v1/config).
      - EVENT_EDITION=${EVENT_EDITION:-USA 2026}
      # The venue's wall clock. Unlike EVENT_EDITION this is NOT display branding:
      # the dt partition is a UTC calendar day, so "today" has to be resolved
      # against the analyst's local day or every same-day count truncates once the
      # UTC date rolls over (17:00 local in Las Vegas). Asia editions: Asia/Singapore.
      - EVENT_TZ=${EVENT_TZ:-America/Los_Angeles}
    depends_on:
      - orchestrator
      - athena-hunter
    restart: unless-stopped

  # Shared response cache for finished agent answers (agents/shared/response_cache.py).
  # Deliberately has NO volume: the cache is disposable by design, everything in it
  # has a TTL of minutes, and persisting it across a redeploy would mean an answer
  # outliving the code and prompts that produced it.
  #
  # maxmemory + allkeys-lru so a long conference run cannot grow this without bound
  # or get OOM-killed. Evicting the least-recently-asked question is exactly the
  # right thing for a cache to do under pressure.
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    # Internal only, same as every agent. Nothing outside the compose network has
    # any business reaching an unauthenticated Redis.
    expose:
      - "6379"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - audit-monitor
      - web-server
    restart: unless-stopped
