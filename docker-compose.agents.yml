services:
  orchestrator:
    build:
      context: .
      dockerfile: agents/orchestrator/Dockerfile
    # Internal only. The orchestrator is reached by web-server over the docker
    # network (http://orchestrator:8001); it must NOT be published to the host —
    # publishing put /admin/killswitch on the public interface (SG-gated only).
    expose:
      - "8001"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Local model (AQLight = fine-tuned Qwen2.5-Coder-7B NL->SQL, served on the box
      # via llama.cpp). Active only when LLM_PROVIDER=local. Default base URL points at
      # the host's llama-server via the docker bridge gateway (host.docker.internal on
      # Docker Desktop; on Linux add an extra_hosts mapping or set LOCAL_LLM_BASE_URL to
      # the host IP). See docs/llm/AQLight-integration.md.
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-AQLight}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-not-needed}
      # LANE RACE: cloud (Gemini) vs local run concurrently and the fastest is
      # shown, with a UI swap to the other. LANE_RACE=auto races only when a local
      # endpoint is configured, so this is inert on a CPU-only box.
      #
      # LOCAL_PROSE_* must default to EMPTY, not to a model name. Unset means the
      # prose role falls back to the SQL endpoint, i.e. AQLight does both jobs, which
      # is the default. Defaulting the model name alone would ask AQLight's
      # llama-server for a model it does not serve. See docs/llm/lane-race.md.
      - LANE_RACE=${LANE_RACE:-auto}
      - LOCAL_SQL_BASE_URL=${LOCAL_SQL_BASE_URL:-}
      - LOCAL_SQL_MODEL=${LOCAL_SQL_MODEL:-}
      - LOCAL_PROSE_BASE_URL=${LOCAL_PROSE_BASE_URL:-}
      - LOCAL_PROSE_MODEL=${LOCAL_PROSE_MODEL:-}
      - ADMIN_BEARER_TOKEN=${ADMIN_BEARER_TOKEN}
      # How long a Manifold threat keeps a session quarantined, in seconds.
      - QUARANTINE_TTL_SECONDS=${QUARANTINE_TTL_SECONDS:-1800}
      - ALERT_TRIAGE_URL=http://alert-triage:8003
      - THOUSANDEYES_ANALYST_URL=http://thousandeyes-analyst:8004
      - ATHENA_HUNTER_URL=http://athena-hunter:8005
      - S3_BUCKET=${S3_BUCKET:-blackhat-pope-dev-logs}
      - S3_REGION=${S3_REGION:-us-west-2}
      - S3_PREFIX=${S3_PREFIX}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_API_KEY=${OTEL_EXPORTER_OTLP_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - TRACE_S3_BUCKET=${TRACE_S3_BUCKET:-blackhat-pope-dev-logs}
      - TRACE_S3_PREFIX=${TRACE_S3_PREFIX:-nocgentic/traces}
      - TRACE_S3_REGION=${TRACE_S3_REGION:-us-west-2}
      - OTEL_SERVICE_NAME=bhnocgentic-orchestrator
      # Public event-edition label (display only). Nation + year, e.g. "USA 2027".
      - EVENT_EDITION=${EVENT_EDITION:-USA 2026}
    # Resolve host.docker.internal to the host on Linux, so the default
    # LOCAL_LLM_BASE_URL can reach the host's llama-server (AQLight) when
    # LLM_PROVIDER=local. Harmless when the local provider is not used.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alert-triage
      - thousandeyes-analyst
      - athena-hunter
    restart: unless-stopped

  alert-triage:
    build:
      context: .
      dockerfile: agents/alert-triage/Dockerfile
    expose:
      - "8003"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-AQLight}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-not-needed}
      # LANE RACE: cloud (Gemini) vs local run concurrently and the fastest is
      # shown, with a UI swap to the other. LANE_RACE=auto races only when a local
      # endpoint is configured, so this is inert on a CPU-only box.
      #
      # LOCAL_PROSE_* must default to EMPTY, not to a model name. Unset means the
      # prose role falls back to the SQL endpoint, i.e. AQLight does both jobs, which
      # is the default. Defaulting the model name alone would ask AQLight's
      # llama-server for a model it does not serve. See docs/llm/lane-race.md.
      - LANE_RACE=${LANE_RACE:-auto}
      - LOCAL_SQL_BASE_URL=${LOCAL_SQL_BASE_URL:-}
      - LOCAL_SQL_MODEL=${LOCAL_SQL_MODEL:-}
      - LOCAL_PROSE_BASE_URL=${LOCAL_PROSE_BASE_URL:-}
      - LOCAL_PROSE_MODEL=${LOCAL_PROSE_MODEL:-}
      - ATHENA_DATABASE=${ATHENA_DATABASE:-blackhat_pope_logs}
      - ATHENA_WORKGROUP=${ATHENA_WORKGROUP:-blackhat-pope-dev}
      - ATHENA_REGION=${ATHENA_REGION:-us-west-2}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_API_KEY=${OTEL_EXPORTER_OTLP_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - TRACE_S3_BUCKET=${TRACE_S3_BUCKET:-blackhat-pope-dev-logs}
      - TRACE_S3_PREFIX=${TRACE_S3_PREFIX:-nocgentic/traces}
      - TRACE_S3_REGION=${TRACE_S3_REGION:-us-west-2}
      - OTEL_SERVICE_NAME=bhnocgentic-alert-triage
      - EVENT_EDITION=${EVENT_EDITION:-USA 2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  athena-hunter:
    build:
      context: .
      dockerfile: agents/athena-hunter/Dockerfile
    expose:
      - "8005"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # athena-hunter is AQLight's home: NL->SQL is exactly what it was trained for.
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-AQLight}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-not-needed}
      # LANE RACE: cloud (Gemini) vs local run concurrently and the fastest is
      # shown, with a UI swap to the other. LANE_RACE=auto races only when a local
      # endpoint is configured, so this is inert on a CPU-only box.
      #
      # LOCAL_PROSE_* must default to EMPTY, not to a model name. Unset means the
      # prose role falls back to the SQL endpoint, i.e. AQLight does both jobs, which
      # is the default. Defaulting the model name alone would ask AQLight's
      # llama-server for a model it does not serve. See docs/llm/lane-race.md.
      - LANE_RACE=${LANE_RACE:-auto}
      - LOCAL_SQL_BASE_URL=${LOCAL_SQL_BASE_URL:-}
      - LOCAL_SQL_MODEL=${LOCAL_SQL_MODEL:-}
      - LOCAL_PROSE_BASE_URL=${LOCAL_PROSE_BASE_URL:-}
      - LOCAL_PROSE_MODEL=${LOCAL_PROSE_MODEL:-}
      # HYBRID: set SQLGEN_PROVIDER=local to route ONLY NL->SQL gen to AQLight while
      # synthesis stays on LLM_PROVIDER (Gemini). Unset -> SQL gen uses LLM_PROVIDER too.
      - SQLGEN_PROVIDER=${SQLGEN_PROVIDER:-}
      - SQLGEN_MODEL=${SQLGEN_MODEL:-}
      - ATHENA_DATABASE=${ATHENA_DATABASE:-blackhat_pope_logs}
      - ATHENA_WORKGROUP=${ATHENA_WORKGROUP:-blackhat-pope-dev}
      - ATHENA_REGION=${ATHENA_REGION:-us-west-2}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_API_KEY=${OTEL_EXPORTER_OTLP_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - TRACE_S3_BUCKET=${TRACE_S3_BUCKET:-blackhat-pope-dev-logs}
      - TRACE_S3_PREFIX=${TRACE_S3_PREFIX:-nocgentic/traces}
      - TRACE_S3_REGION=${TRACE_S3_REGION:-us-west-2}
      - OTEL_SERVICE_NAME=bhnocgentic-athena-hunter
      - EVENT_EDITION=${EVENT_EDITION:-USA 2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  thousandeyes-analyst:
    build:
      context: .
      dockerfile: agents/thousandeyes-analyst/Dockerfile
    expose:
      - "8004"
    environment:
      - THOUSANDEYES_BEARER_TOKEN=${THOUSANDEYES_BEARER_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-AQLight}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-not-needed}
      # LANE RACE: cloud (Gemini) vs local run concurrently and the fastest is
      # shown, with a UI swap to the other. LANE_RACE=auto races only when a local
      # endpoint is configured, so this is inert on a CPU-only box.
      #
      # LOCAL_PROSE_* must default to EMPTY, not to a model name. Unset means the
      # prose role falls back to the SQL endpoint, i.e. AQLight does both jobs, which
      # is the default. Defaulting the model name alone would ask AQLight's
      # llama-server for a model it does not serve. See docs/llm/lane-race.md.
      - LANE_RACE=${LANE_RACE:-auto}
      - LOCAL_SQL_BASE_URL=${LOCAL_SQL_BASE_URL:-}
      - LOCAL_SQL_MODEL=${LOCAL_SQL_MODEL:-}
      - LOCAL_PROSE_BASE_URL=${LOCAL_PROSE_BASE_URL:-}
      - LOCAL_PROSE_MODEL=${LOCAL_PROSE_MODEL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_API_KEY=${OTEL_EXPORTER_OTLP_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - TRACE_S3_BUCKET=${TRACE_S3_BUCKET:-blackhat-pope-dev-logs}
      - TRACE_S3_PREFIX=${TRACE_S3_PREFIX:-nocgentic/traces}
      - TRACE_S3_REGION=${TRACE_S3_REGION:-us-west-2}
      - OTEL_SERVICE_NAME=bhnocgentic-thousandeyes-analyst
      - EVENT_EDITION=${EVENT_EDITION:-USA 2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  audit-monitor:
    build:
      context: .
      dockerfile: tools/audit-monitor/Dockerfile
    expose:
      - "8787"
    environment:
      - AUDIT_BUCKET=${AUDIT_BUCKET:-blackhat-pope-dev-logs}
      - AUDIT_PREFIX=${AUDIT_PREFIX:-nocgentic/traces}
      - AUDIT_REGION=${AUDIT_REGION:-us-west-2}
      - AUDIT_ROOT_PATH=/bh/1337/thetraces
      - AUDIT_POLL_S=${AUDIT_POLL_S:-2}
      - AUDIT_LOOKBACK=${AUDIT_LOOKBACK:-300}
      - AUDIT_BEARER_TOKEN=${AUDIT_BEARER_TOKEN}
      - AUDIT_COOKIE_SECRET=${AUDIT_COOKIE_SECRET}
      - AUDIT_COOKIE_TTL=${AUDIT_COOKIE_TTL:-86400}
      # Forwarded to the orchestrator's now-authenticated /admin/* endpoints.
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - ADMIN_BEARER_TOKEN=${ADMIN_BEARER_TOKEN}
    restart: unless-stopped

  web-server:
    build:
      context: .
      dockerfile: packages/web-server/Dockerfile
    expose:
      - "3000"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - ATHENA_HUNTER_URL=http://athena-hunter:8005
      # Lets the alert feed read the orchestrator kill-switch so "kill athena"
      # also freezes the live feed, not just chat (QA sweep 4, cc-1).
      - ADMIN_BEARER_TOKEN=${ADMIN_BEARER_TOKEN}
      # Bearer token Manifold must present to POST /api/v1/manifold/webhook.
      # Unset -> the receiver fails closed and 401s everything.
      - MANIFOLD_WEBHOOK_TOKEN=${MANIFOLD_WEBHOOK_TOKEN}
      - ALERT_REFRESH_MS=${ALERT_REFRESH_MS:-1800000}
      - ALERT_LOOKBACK_HOURS=${ALERT_LOOKBACK_HOURS:-24}
      - ALERT_MAX_FETCH=${ALERT_MAX_FETCH:-200}
      - PORT=3000
      - NODE_ENV=production
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://ng.bhnoc.com,https://ngremote.bhnoc.com}
      # Public event-edition label shown in the UI (served via /api/v1/config).
      - EVENT_EDITION=${EVENT_EDITION:-USA 2026}
    depends_on:
      - orchestrator
      - athena-hunter
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - audit-monitor
      - web-server
    restart: unless-stopped
